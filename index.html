<!doctype html>
<html>

<head>
  <title>LA TV Shows | Home</title>
  <meta name="description" content="A Catalog of Shows Set in Los Angeles" />
  <link rel="stylesheet" href="./style.css" />
  <script type="module" src="./scripts.js"></script>
</head>

<body>
  <header class="main-header">
    <h1 class="title">Recipes: Charlie's Greatest Hits</h1>
    <nav>
      <ul id="filter-container">
        <li class="filter-item" data-filter="" style="display: none"></li>
      </ul>
      <div id="sort-container">
        <button class="sort-button" data-sort="time" data-order="asc">
          Sort by cook time
        </button>
      </div>
    </nav>
  </header>

  <!-- card container -->
  <div id="card-container"></div>

  <!-- card template -->
  <div class="card" style="display: none">
    <div class="card-content">
      <h2>Recipe</h2>
      <div class="topMetaData-container">
        <div class="time-container">
          <p class="time-content">Cook time: <span class="time"></span>m</p>
        </div>
        <ul class="diet-list">
          <li class="diet-item" style="display: none">
            <img src="" alt="" />
          </li>
        </ul>
      </div>
      <img class="recipe-img" src="" alt="title + recipe image" />
      <ul class="tags">
        <li class="tag-item" style="display: none"></li>
      </ul>
    </div>
  </div>

  <div class="footer">
    <button id="reset-button">Reset</button>
  </div>
</body>

</html>
